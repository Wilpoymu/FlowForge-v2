<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowForge v2</title>
<style>
  :root {
    --bg: #080810;
    --bg-elevated: #0f0f1a;
    --card: #141420;
    --card-hover: #1a1a2e;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --accent: #ff4757;
    --accent-glow: rgba(255,71,87,0.3);
    --accent-hover: #ff6b81;
    --text: #e8e8f0;
    --text-secondary: #8b8ba0;
    --text-muted: #5a5a70;
    --success: #2ed573;
    --success-glow: rgba(46,213,115,0.2);
    --warning: #ffa502;
    --error: #ff4757;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* ── Header ──────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), #ff6b81);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    box-shadow: 0 2px 12px var(--accent-glow);
  }
  .brand-text h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand-text span {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.05em;
  }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 16px;
    font-size: 0.8rem;
    color: var(--text-secondary);
    transition: var(--transition);
  }
  .status-pill:hover { border-color: var(--border-hover); }
  .status-pill .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    position: relative;
  }
  .status-pill .dot.online {
    background: var(--success);
    box-shadow: 0 0 8px var(--success-glow);
  }
  .status-pill .dot.online::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 2px solid var(--success);
    opacity: 0.4;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.3); opacity: 0; }
  }

  /* ── Section Cards ───────────────────── */
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
    transition: var(--transition);
  }
  .section:hover { border-color: var(--border-hover); }
  .section-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── Account Cards ───────────────────── */
  .accounts-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .account-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.82rem;
    transition: var(--transition);
    cursor: pointer;
  }
  .account-card:hover { border-color: var(--border-hover); background: var(--card-hover); }
  .account-card.connected { border-color: rgba(46,213,115,0.3); }
  .account-card.connected:hover { border-color: rgba(46,213,115,0.5); }
  .account-card label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    width: 100%;
  }
  .account-card input[type="checkbox"] {
    width: 16px; height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .account-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  .account-info { flex: 1; min-width: 0; }
  .account-info .email {
    color: var(--text);
    font-weight: 500;
    font-size: 0.8rem;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .account-info .hash {
    color: var(--text-muted);
    font-size: 0.68rem;
    font-family: 'SF Mono', monospace;
  }
  .account-status {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .account-card.connected .account-status {
    background: var(--success);
    box-shadow: 0 0 6px var(--success-glow);
  }
  .no-accounts {
    color: var(--text-muted);
    font-style: italic;
    font-size: 0.85rem;
    padding: 8px 0;
  }
  .empty-state {
    text-align: center;
    padding: 32px 20px;
    width: 100%;
  }
  .empty-icon {
    font-size: 2.5rem;
    margin-bottom: 12px;
    opacity: 0.5;
  }
  .empty-title {
    color: var(--text-secondary);
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .empty-hint {
    color: var(--text-muted);
    font-size: 0.78rem;
  }
  .empty-hint code {
    background: var(--bg-elevated);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', monospace;
    font-size: 0.75rem;
  }

  /* ── Input Section ───────────────────── */
  .input-area {
    position: relative;
  }
  .input-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .btn-load-json {
    background: transparent;
    color: var(--text-secondary);
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 14px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-load-json:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255,71,87,0.05);
  }
  .json-file-name {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .input-area textarea {
    width: 100%;
    min-height: 140px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 14px 16px;
    font-family: inherit;
    font-size: 0.88rem;
    line-height: 1.7;
    resize: vertical;
    outline: none;
    transition: var(--transition);
  }
  .input-area textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .input-area textarea::placeholder { color: var(--text-muted); }

  .json-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0 4px;
  }

  /* ── Project Grid ────────────────────── */
  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }
  .project-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }
  .project-card:hover { border-color: var(--accent); background: var(--card-hover); }
  .project-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .project-card .thumb {
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--card);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: var(--text-muted);
    overflow: hidden;
    position: relative;
  }
  .project-card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .project-card .thumb .no-thumb {
    opacity: 0.3;
  }
  .project-card .proj-name {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 2px;
  }
  .project-card .proj-title {
    font-size: 0.7rem;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 6px;
  }
  .project-card .proj-stats {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .project-card .proj-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }
  .project-card .proj-bar .fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
  }
  .project-card .proj-status {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--bg-elevated);
  }
  .status-planning { background: var(--text-muted); }
  .status-generating { background: var(--warning); }
  .status-editing { background: var(--accent); }
  .status-complete { background: var(--success); box-shadow: 0 0 6px var(--success-glow); }

  /* ── Controls Row ────────────────────── */
  .controls-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 14px;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .control-group label {
    font-size: 0.68rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .control-group input[type="text"] {
    flex: 1;
    min-width: 220px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 10px 12px;
    font-family: 'SF Mono', monospace;
    font-size: 0.8rem;
    outline: none;
    transition: var(--transition);
  }
  .control-group input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }
  .control-group select {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.8rem;
    outline: none;
    cursor: pointer;
    min-width: 100px;
  }
  .concurrency-control {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 100px;
  }
  .concurrency-control .slider-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .concurrency-control input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  .concurrency-control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 8px var(--accent-glow);
    transition: var(--transition);
  }
  .concurrency-control input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }
  .concurrency-control .val {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    min-width: 20px;
    text-align: center;
  }

  .btn-generate {
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 28px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 2px 12px var(--accent-glow);
    margin-left: auto;
  }
  .btn-generate:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  .btn-generate:active:not(:disabled) { transform: translateY(0); }
  .btn-generate:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
    filter: grayscale(0.6);
  }
  .btn-generate.invalid {
    opacity: 0.35;
    filter: grayscale(0.6);
    cursor: not-allowed;
  }
  .btn-retry {
    background: transparent;
    color: var(--warning);
    border: 1px solid var(--warning);
    border-radius: var(--radius-sm);
    padding: 11px 20px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    margin-left: 8px;
  }
  .btn-retry:hover { background: rgba(255,165,2,0.1); }

  /* ── Progress ────────────────────────── */
  .progress-section {
    display: none;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .progress-section.visible { display: block; }
  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .progress-header span {
    font-size: 0.82rem;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .progress-header .pct {
    color: var(--accent);
    font-weight: 700;
  }
  .progress-track {
    height: 6px;
    background: var(--bg-elevated);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-hover));
    border-radius: 3px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
    position: relative;
    overflow: hidden;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ── Results ─────────────────────────── */
  .results-section {
    display: none;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .results-section.visible { display: block; }
  .results-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 420px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .results-grid::-webkit-scrollbar { width: 4px; }
  .results-grid::-webkit-scrollbar-track { background: transparent; }
  .results-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .result-card {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 0.82rem;
    transition: var(--transition);
  }
  .result-card:hover { border-color: var(--border-hover); }
  .result-card.done { border-left: 3px solid var(--success); }
  .result-card.generating { border-left: 3px solid var(--warning); }
  .result-card.queued { border-left: 3px solid var(--text-muted); }
  .result-card.failed { border-left: 3px solid var(--error); }
  .result-card.cancelled { border-left: 3px solid var(--text-muted); }

  .result-icon {
    font-size: 1.1rem;
    width: 24px;
    text-align: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .result-card.done .result-icon { color: var(--success); }
  .result-card.generating .result-icon { color: var(--warning); }
  .result-card.queued .result-icon { color: var(--text-muted); }
  .result-card.failed .result-icon { color: var(--error); }
  .result-card.cancelled .result-icon { color: var(--text-muted); }

  .result-body { flex: 1; min-width: 0; }
  .result-index {
    color: var(--text-muted);
    font-family: 'SF Mono', monospace;
    font-size: 0.72rem;
    margin-bottom: 2px;
  }
  .result-prompt {
    color: var(--text);
    line-height: 1.5;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .result-error {
    color: var(--error);
    font-size: 0.75rem;
    margin-top: 4px;
    opacity: 0.85;
  }
  .result-meta {
    color: var(--text-muted);
    font-size: 0.72rem;
    font-family: 'SF Mono', monospace;
    margin-top: 4px;
  }

  /* ── Toast ───────────────────────────── */
  .toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 14px 20px;
    font-size: 0.85rem;
    font-weight: 500;
    display: none;
    z-index: 1000;
    box-shadow: var(--shadow-lg);
    max-width: 360px;
    animation: toastIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .toast.visible { display: block; }
  @keyframes toastIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* ── Animations ──────────────────────── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .section { animation: fadeIn 0.4s ease; }

  /* ── Responsive ──────────────────────── */
  @media (max-width: 768px) {
    .app { padding: 16px 12px; }
    .header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .controls-row { flex-direction: column; align-items: stretch; }
    .control-group { width: 100%; }
    .control-group input[type="text"] { min-width: 100%; }
    .btn-generate { width: 100%; margin-left: 0; margin-top: 8px; }
    .btn-retry { width: 100%; margin-left: 0; margin-top: 8px; }
    .concurrency-control { width: 100%; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">&#9889;</div>
      <div class="brand-text">
        <h1>FlowForge</h1>
        <span>v2.0 &mdash; Generaci&oacute;n masiva de im&aacute;genes</span>
      </div>
    </div>
    <div class="status-pill" id="accountBadge">
      <span class="dot" id="badgeDot"></span>
      <span id="badgeText">0 cuentas</span>
    </div>
  </div>

  <!-- Projects -->
  <div class="section">
    <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="toggleProjects()">
      <div class="section-title" style="margin-bottom:0">
        <span id="projectToggle">&#9654;</span> &#128193; Proyectos <span id="projectCount" style="font-weight:400;color:var(--text-muted)"></span>
      </div>
      <div style="display:flex;gap:8px" onclick="event.stopPropagation()">
        <button class="btn-load-json" onclick="migrateProjects()" id="migrateBtn" style="font-size:0.72rem;padding:5px 10px">Guardar todo</button>
        <button class="btn-load-json" onclick="showNewProject()" style="font-size:0.72rem;padding:5px 10px">+ Nuevo</button>
      </div>
    </div>
    <div id="projectGrid" class="project-grid" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)"></div>
    <div id="selectedProject" style="margin-top:8px;font-size:0.78rem;color:var(--text-muted)">Ningún proyecto seleccionado</div>
    <div id="newProjectForm" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
      <div class="control-group">
        <label>Nombre</label>
        <input type="text" id="newProjectName" placeholder="acuario-mayo-2026" style="width:180px">
      </div>
      <div class="control-group">
        <label>Título (opcional)</label>
        <input type="text" id="newProjectTitle" placeholder="Acuario Mayo 2026" style="width:180px">
      </div>
      <button class="btn-generate" onclick="createProject()" style="margin-left:0;padding:8px 18px;font-size:0.82rem">Crear</button>
      <button class="btn-load-json" onclick="cancelNewProject()">Cancelar</button>
    </div>
  </div>

  <!-- Accounts -->
  <div class="section">
    <div class="section-title">&#128187; Cuentas conectadas</div>
    <div class="accounts-grid" id="accountsGrid">
      <div class="empty-state">
        <div class="empty-icon">&#128187;</div>
        <div class="empty-title">Esperando extensiones de Flow</div>
        <div class="empty-hint">Abre <code>labs.google/fx/tools/flow</code> en Chrome con la extensi&oacute;n cargada</div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="section">
    <div class="section-title">&#9998; Prompts de imagen</div>
    <div class="input-area">
      <textarea id="promptsInput" placeholder="Una escena por l&iacute;nea...

Ejemplo:
Un bosque oscuro con niebla
Un castillo en la cima de una monta&ntilde;a
Un drag&oacute;n volando sobre un lago"></textarea>
    </div>
    <div class="json-bar">
      <input type="file" id="jsonFileInput" accept=".json" style="display:none" onchange="loadPromptsFromJSON(event)">
      <button class="btn-load-json" id="loadJsonBtn" onclick="document.getElementById('jsonFileInput').click()">
        &#128193; Cargar JSON de prompts
      </button>
      <span class="json-file-name" id="jsonFileName"></span>
    </div>
    <div class="controls-row folder-row">
      <div class="control-group" style="flex:1">
        <label>Carpeta de salida</label>
        <input type="text" id="outputFolder" placeholder="C:\Users\...\output">
      </div>
    </div>
    <div class="controls-row action-row">
      <div class="control-group">
        <label>Modelo</label>
        <select id="modelSelect">
          <option value="NARWHAL">NARWHAL</option>
        </select>
      </div>
      <div class="concurrency-control">
        <label>Paralelo</label>
        <div class="slider-wrap">
          <input type="range" id="concurrencySlider" min="1" max="20" value="2"
            oninput="document.getElementById('concurrencyLabel').textContent=this.value">
          <span class="val" id="concurrencyLabel">2</span>
        </div>
      </div>
      <div style="flex:1"></div>
      <button class="btn-generate invalid" id="generateBtn" onclick="startBatch()" disabled>Generar</button>
      <button class="btn-retry" id="retryBtn" onclick="retryFailed()" style="display:none">Reintentar fallidas</button>
    </div>

    <!-- Progress -->
    <div class="progress-section" id="progressSection">
      <div class="progress-header">
        <span id="progressLabel">0 / 0 completado</span>
        <span class="pct" id="progressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Results -->
    <div class="results-section" id="resultsSection">
      <div class="results-grid" id="resultsList"></div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/dashboard/app.js"></script>
</body>
</html>
